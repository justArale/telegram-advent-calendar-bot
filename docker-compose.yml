version: '3.8'

services:
  advent-bot:
    build: .
    container_name: advent-calendar-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - TIMEZONE=${TIMEZONE}
      - ENVIRONMENT=${ENVIRONMENT}
    volumes:
      - ./logs:/app/logs
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge